services:
  voice-analyzer:
    container_name: voice-analyzer-api
    build:
      context: .
      dockerfile: ./Dockerfile.arm64
    ports:
      - "5001:5001"
    volumes:
      - ./app:/app
      - ./sample:/sample
      - ./models:/root/.cache/huggingface
      - ./logs:/logs
    environment:
      - TZ=Asia/Tokyo
      - LOG_LEVEL=DEBUG
      - ENV=production
      - LOG_BACKUP_COUNT=14
      - LOG_DIR=/logs
      # Whisper設定（ラズパイ向け最適化）
      - WHISPER_MODEL_SIZE=base
      - WHISPER_BEAM_SIZE=1
      - WHISPER_BEST_OF=1
      # CPUスレッド数（Pi 4/5の4コアに合わせる）
      - WHISPER_CPU_THREADS=4
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_VAD_ENABLED=false
      # チャンク設定（3秒 × TRANSCRIPTION_INTERVAL より必ず大きくすること。
      # 下回ると毎回トリミングが走りタイムスタンプ整合が壊れてテキストが欠落する）
      - CUMULATIVE_MAX_AUDIO_SECONDS=20.0
      - CUMULATIVE_TRANSCRIPTION_INTERVAL=5
      # 要約機能をGeminiで使う場合はAPIキーを設定
      # - GEMINI_API_KEY=your_api_key_here
      # - SUMMARY_PROVIDER=gemini
    restart: unless-stopped
    networks:
      - pi_network

networks:
  pi_network:
    driver: bridge
